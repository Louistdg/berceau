<section class="pg" id="pages" aria-label="Pages de la famille">
  <header class="pg-head">
    <button class="pg-back" id="pg-back" type="button">← L'arbre</button>
    <nav class="pg-tabs" aria-label="Pages">
      <button type="button" data-page="noms">Les noms</button>
      <button type="button" data-page="chronologie">Chronologie</button>
      <button type="button" data-page="lieux">Les lieux</button>
    </nav>
  </header>
  <div class="pg-body" id="pg-body"></div>
</section>
<script id="pages-famille-script">(function(){
  'use strict';
  var D = window.FAMILY_DATA;
  var page = 'noms';

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
  function strip(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
  function annee(d){ if(!d) return null; var m=/(\d{4})/.exec(String(d)); if(!m) return null; var y=+m[1]; return (y>1400&&y<2100)?y:null; }
  function naissance(p){ return annee(p.birth&&p.birth.date); }
  function deces(p){ return annee(p.death&&p.death.date); }
  function lieu(p){ return ((p.birth&&p.birth.place)||(p.death&&p.death.place)||'').trim(); }
  function commune(l){ return String(l).split(',')[0].trim(); }
  function nf(n){ return n.toLocaleString('fr-BE'); }
  function span(min,max){ if(min==null&&max==null) return ''; if(min==null) return 'jusqu’en '+max; if(max==null) return 'depuis '+min; if(min===max) return 'en '+min; return 'de '+min+' à '+max; }

  function personnes(){
    if(!D || !D.people) return [];
    return D.people.filter(function(p){ return p && p.name; });
  }

  function groupesNoms(){
    var m = new Map();
    personnes().forEach(function(p){
      var brut = (p.surname||'').trim();
      if(!brut) return;
      var cle = strip(brut);
      if(!cle) return;
      var g = m.get(cle);
      if(!g){ g={ cle:cle, variantes:new Map(), n:0, min:null, max:null, lieux:new Map() }; m.set(cle,g); }
      g.n++;
      g.variantes.set(brut,(g.variantes.get(brut)||0)+1);
      var a=naissance(p);
      if(a!=null){ if(g.min==null||a<g.min)g.min=a; if(g.max==null||a>g.max)g.max=a; }
      var l=lieu(p); if(l){ var c=commune(l); var k=strip(c); if(k){ var cur=g.lieux.get(k); if(cur)cur.n++; else g.lieux.set(k,{nom:c,n:1}); } }
    });
    return [...m.values()].sort(function(a,b){ return b.n-a.n || a.cle.localeCompare(b.cle); });
  }

  function groupesLieux(){
    var m = new Map();
    personnes().forEach(function(p){
      var l = lieu(p); if(!l) return;
      var c = commune(l); if(!c) return;
      var cle = strip(c); if(!cle) return;
      var g = m.get(cle);
      if(!g){ g={ cle:cle, graphies:new Map(), n:0, min:null, max:null }; m.set(cle,g); }
      g.n++;
      g.graphies.set(c,(g.graphies.get(c)||0)+1);
      var a=naissance(p)||deces(p);
      if(a!=null){ if(g.min==null||a<g.min)g.min=a; if(g.max==null||a>g.max)g.max=a; }
    });
    return [...m.values()].sort(function(a,b){ return b.n-a.n || a.cle.localeCompare(b.cle); });
  }

  function parDixaine(liste){
    var m=new Map(), min=null, max=null;
    liste.forEach(function(p){
      var a=naissance(p); if(a==null) return;
      if(min==null||a<min)min=a; if(max==null||a>max)max=a;
      var d=Math.floor(a/10)*10;
      m.set(d,(m.get(d)||0)+1);
    });
    return { tranches:[...m.entries()].sort(function(a,b){return a[0]-b[0];}), min:min, max:max };
  }

  function plusFrequent(map){
    var best=null, n=-1;
    map.forEach(function(v,k){ if(v>n){ n=v; best=k; } });
    return best;
  }

  function entete(titre, chapeau){
    var f=document.createDocumentFragment();
    f.appendChild(el('h1',null,titre));
    if(chapeau) f.appendChild(el('p','pg-lead',chapeau));
    return f;
  }

  function stats(items){
    var g=el('div','pg-stats');
    items.forEach(function(it){
      var b=el('div','pg-stat');
      b.appendChild(el('b',null,it[0]));
      b.appendChild(el('span',null,it[1]));
      g.appendChild(b);
    });
    return g;
  }

  function ligne(nom, compte, total, meta, variantes){
    var r=el('article','pg-row');
    var h=el('div','pg-row-head');
    h.appendChild(el('h2',null,nom));
    h.appendChild(el('span','pg-count',nf(compte)+' personne'+(compte>1?'s':'')));
    r.appendChild(h);
    var bar=el('div','pg-bar'); var i=el('i'); i.style.width=Math.max(2,Math.round(100*compte/total))+'%'; bar.appendChild(i); r.appendChild(bar);
    r.appendChild(el('p','pg-meta',meta));
    if(variantes && variantes.length>1){
      var v=el('p','pg-vars');
      variantes.forEach(function(x){ v.appendChild(el('span',null,x)); });
      r.appendChild(v);
    }
    return r;
  }

  function vide(txt){
    var d=el('div','pg-empty'); d.textContent=txt; return d;
  }

  function pied(){
    return el('p','pg-foot','Page calculée à partir de votre arbre. Aucune donnée ne quitte votre appareil.');
  }

  function rendreNoms(){
    var body=document.getElementById('pg-body');
    var groupes=groupesNoms();
    var gens=personnes();
    body.replaceChildren();
    if(!groupes.length){
      body.appendChild(entete('Les noms de la famille'));
      body.appendChild(vide('Les noms sont masqués dans cette copie de démonstration. Cette page les affiche dès que l’arbre contient de vrais noms de famille.'));
      return;
    }
    var total=groupes.reduce(function(s,g){return s+g.n;},0);
    var max=groupes[0].n;
    var plusAncien=groupes.filter(function(g){return g.min!=null;}).sort(function(a,b){return a.min-b.min;})[0];
    var uniques=groupes.filter(function(g){return g.variantes.size===1;}).length;
    body.appendChild(entete('Les noms de la famille',
      nf(groupes.length)+' noms différents, '+nf(total)+' personnes. Les graphies proches sont regroupées ; les variantes restent affichées.'));
    var graphies=groupes.reduce(function(s,g){return s+g.variantes.size;},0);
    var nomCourant=groupes[0].cle.charAt(0).toUpperCase()+groupes[0].cle.slice(1);
    var nomAncien=plusAncien ? plusAncien.cle.charAt(0).toUpperCase()+plusAncien.cle.slice(1) : null;
    body.appendChild(stats([
      [nf(groupes[0].n), 'personnes portant le nom le plus courant — '+nomCourant],
      [plusAncien ? String(plusAncien.min) : '—', plusAncien ? 'la plus ancienne naissance — '+nomAncien : 'aucune date'],
      [nf(graphies)+' / '+nf(groupes.length), 'graphies recensées pour ces noms']
    ]));
    groupes.forEach(function(g){
      var variantes=[...g.variantes.entries()].sort(function(a,b){return b[1]-a[1];}).map(function(x){ return x[1]>1 ? x[0]+' ('+x[1]+')' : x[0]; });
      var nom=g.cle.charAt(0).toUpperCase()+g.cle.slice(1);
      var lieuxTop=[...g.lieux.values()].sort(function(a,b){return b.n-a.n;}).slice(0,3).map(function(x){return x.nom;});
      var meta=span(g.min,g.max)+(g.lieux.size?(' · '+lieuxTop.join(' · ')):'');
      body.appendChild(ligne(nom, g.n, max, meta, variantes));
    });
    body.appendChild(pied());
  }

  function rendreChronologie(){
    var body=document.getElementById('pg-body');
    var gens=personnes();
    var d=parDixaine(gens);
    body.replaceChildren();
    body.appendChild(entete('La chronologie',
      gens.length ? ('Naissances et décès, décennie par décennie, d’après les dates portées dans l’arbre.') : 'Aucune personne.'));
    if(!d.tranches.length){
      body.appendChild(vide('Aucune date de naissance renseignée dans cet arbre.'));
      return;
    }
    var max=Math.max.apply(null,d.tranches.map(function(t){return t[1];}));
    var decedes=gens.map(deces).filter(function(x){return x!=null;});
    var lieux=groupesLieux();
    var decesParDixaine=new Map();
    decedes.forEach(function(a){ var d=Math.floor(a/10)*10; decesParDixaine.set(d,(decesParDixaine.get(d)||0)+1); });
    body.appendChild(stats([
      [nf(gens.filter(function(p){return naissance(p)!=null;}).length), 'personnes avec une année de naissance'],
      [nf(decedes.length), 'personnes avec une année de décès'],
      [d.min+' – '+d.max, 'période couverte'],
      [lieux.length?lieux[0].graphies.keys().next().value:'—', 'lieu le plus cité']
    ]));
    d.tranches.forEach(function(t){
      var r=el('article','pg-row');
      var h=el('div','pg-row-head');
      h.appendChild(el('h2',null,t[0]+'–'+(t[0]+9)));
      var morts=decesParDixaine.get(t[0])||0;
      h.appendChild(el('span','pg-count',nf(t[1])+' naissance'+(t[1]>1?'s':'')+(morts?(' · '+nf(morts)+' décès'):'')));
      r.appendChild(h);
      var bar=el('div','pg-bar'); var i=el('i'); i.style.width=Math.max(2,Math.round(100*t[1]/max))+'%'; bar.appendChild(i); r.appendChild(bar);
      var dansLaTranche=gens.filter(function(p){var a=naissance(p);return a!=null&&a>=t[0]&&a<=t[0]+9;});
      var noms=[...new Set(dansLaTranche.map(function(p){return (p.surname||'').trim();}).filter(Boolean))].slice(0,3);
      if(noms.length) r.appendChild(el('p','pg-meta','Noms cités : '+noms.join(' · ')));
      body.appendChild(r);
    });
    body.appendChild(pied());
  }

  function rendreLieux(){
    var body=document.getElementById('pg-body');
    var groupes=groupesLieux();
    var gens=personnes();
    body.replaceChildren();
    body.appendChild(entete('Les lieux','Les communes citées dans l’arbre, regroupées malgré les différences d’écriture (accents, majuscules, compléments d’adresse).'));
    if(!groupes.length){
      body.appendChild(vide('Aucun lieu renseigné dans cet arbre. Les communes apparaîtront ici dès qu’elles seront présentes dans les fiches.'));
      return;
    }
    var max=groupes[0].n;
    body.appendChild(stats([
      [nf(groupes.length), 'communes'],
      [nf(groupes.reduce(function(s,g){return s+g.n;},0)), 'personnes situées'],
      [nf(groupes.filter(function(g){return g.graphies.size>1;}).length), 'communes à plusieurs graphies']
    ]));
    groupes.forEach(function(g){
      var graphies=[...g.graphies.entries()].sort(function(a,b){return b[1]-a[1];}).map(function(x){ return x[1]>1 ? x[0]+' ('+x[1]+')' : x[0]; });
      var principale=graphies[0];
      var nom=principale.replace(/ \(\d+\)$/,'');
      body.appendChild(ligne(nom, g.n, max, span(g.min,g.max), graphies));
    });
    body.appendChild(pied());
  }

  function rendre(p){
    page=p;
    document.querySelectorAll('.pg-tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-page')===p); });
    if(p==='chronologie') rendreChronologie();
    else if(p==='lieux') rendreLieux();
    else rendreNoms();
    var s=document.getElementById('pages'); if(s) s.scrollTop=0;
  }

  function ouvrir(p){
    var s=document.getElementById('pages'); if(!s) return;
    s.classList.add('on');
    rendre(p||page);
    try{ document.querySelector('aside')?.classList.remove('ouvert'); }catch(e){}
    var b=document.getElementById('pg-back'); if(b) b.focus({preventScroll:true});
  }
  function fermer(){
    var s=document.getElementById('pages'); if(s) s.classList.remove('on');
    try{ document.getElementById('menu')?.focus({preventScroll:true}); }catch(e){}
  }

  function monterNav(){
    var aside=document.querySelector('aside');
    if(!aside || aside.querySelector('[data-pg-nav]')) return;
    var label=el('p','section-label','Découvrir');
    var nav=el('div','nav'); nav.setAttribute('data-pg-nav','');
    [['noms','Les noms'],['chronologie','Chronologie'],['lieux','Les lieux']].forEach(function(x){
      var b=el('button',null,x[1]); b.type='button'; b.setAttribute('data-ouvre',x[0]);
      nav.appendChild(b);
    });
    aside.appendChild(label); aside.appendChild(nav);
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest ? e.target.closest('[data-ouvre],[data-page],#pg-back') : null;
    if(!t) return;
    if(t.id==='pg-back'){ e.preventDefault(); fermer(); return; }
    if(t.hasAttribute('data-page')){ e.preventDefault(); rendre(t.getAttribute('data-page')); return; }
    if(t.hasAttribute('data-ouvre')){ e.preventDefault(); ouvrir(t.getAttribute('data-ouvre')); }
  });
  document.addEventListener('keydown',function(e){
    var s=document.getElementById('pages');
    if(e.key==='Escape' && s && s.classList.contains('on')){ e.preventDefault(); fermer(); }
  });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',monterNav); else monterNav();
  setTimeout(monterNav,800); setTimeout(monterNav,2500);
})();</script>

<script id="interface-telephone-script">(function(){
  'use strict';
  var mq = window.matchMedia('(max-width: 720px)');
  var top = document.querySelector('.top');
  var toolbar = document.querySelector('.toolbar');
  var gen = document.querySelector('.generation-control');
  var sel = document.getElementById('depth');
  var reduit = false;

  function ajouterOption(){
    if(!sel || sel.querySelector('option[value="1"]')) return;
    var o = document.createElement('option');
    o.value = '1';
    o.textContent = '2 générations';
    sel.insertBefore(o, sel.firstChild);
  }

  function etiquettes(){
    if(!sel) return;
    [].forEach.call(sel.options, function(o){
      if(!o.dataset.long) o.dataset.long = o.textContent;
      o.textContent = mq.matches ? o.dataset.long.replace('générations','gén.') : o.dataset.long;
    });
  }

  function placeholder(){
    var inp = document.getElementById('search');
    if(!inp) return;
    if(!inp.dataset.long) inp.dataset.long = inp.placeholder;
    inp.placeholder = mq.matches ? 'Rechercher' : inp.dataset.long;
  }

  function changer(valeur){
    if(!sel) return;
    sel.value = valeur;
    sel.dispatchEvent(new Event('change', {bubbles: true}));
  }

  function placer(){
    if(!gen || !top || !toolbar) return;
    if(mq.matches){
      if(gen.parentElement !== top) top.appendChild(gen);
    } else {
      if(gen.parentElement !== toolbar){
        var z = document.getElementById('zoomout');
        if(z) toolbar.insertBefore(gen, z); else toolbar.appendChild(gen);
      }
      if(reduit && sel && sel.value === '1'){ reduit = false; changer('2'); }
    }
  }

  function demarrer(){
    top = document.querySelector('.top');
    toolbar = document.querySelector('.toolbar');
    gen = document.querySelector('.generation-control');
    sel = document.getElementById('depth');
    ajouterOption();
    etiquettes();
    placeholder();
    placer();
    if(mq.matches && sel && sel.value === '2' && !reduit){ reduit = true; changer('1'); }
    
  }

  setInterval(demarrer, 700);
  function dessus(){
    var vp = document.getElementById('viewport'); if(!vp) return;
    var ps = [].slice.call(vp.querySelectorAll('.person'));
    if(!ps.length) return;
    if(vp.lastElementChild !== ps[ps.length-1]){
      ps.forEach(function(g){ vp.appendChild(g); });
      [].slice.call(vp.querySelectorAll('.branch-toggle')).forEach(function(t){ vp.appendChild(t); });
    }
  }
  setInterval(dessus, 600);
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
  setTimeout(demarrer, 1000);
  if(mq.addEventListener) mq.addEventListener('change', placer); else mq.addListener(placer);
})();</script>
