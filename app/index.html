 function carteEtroite(){try{return window.innerWidth<700;}catch(e){return false;}}
 function nodeLines(p){const n=carteEtroite()?19:27,d=carteEtroite()?22:31;return {name:wrapped(p.name,n),birth:wrapped('° '+birth(p),d),death:p.death?.known?wrapped('† '+([date(p.death.date),p.death.place].filter(Boolean).join(' · ')||'Décès, date inconnue'),d):[]};}

 function buildPedigreeGraph(ids){
  // Layout for the interactive ancestor view. Couple units occupy a single
  // horizontal slot; their ancestors are laid out generation by generation.
  // This avoids crossing the two sides of the pedigree during expansion.
  const cards=new Map();
  for(const id of ids){
   const p=people.get(id);
   if(!p)continue;
   const lines=nodeLines(p);
   const etroit=carteEtroite();cards.set(id,{person:p,lines,width:etroit?168:250,height:etroit?Math.max(104,34+lines.name.length*18+(lines.birth.length+lines.death.length)*14):Math.max(124,40+lines.name.length*20+(lines.birth.length+lines.death.length)*16)});
  }
  const rankOf=id=>Math.max(0,-(people.get(id)?.generation||0));
  const owner=new Map(),units=new Map();
  const orderedFamilies=[...D.families].sort((a,b)=>{
   const score=f=>f.partnerIds.filter(id=>people.get(id)?.directAncestor).length*10+
     Number(f.partnerIds.includes(D.fatherId)&&f.partnerIds.includes(D.motherId))*100;
   return score(b)-score(a);
  });
  for(const f of orderedFamilies){
   let partners=f.partnerIds.filter(id=>cards.has(id)&&!owner.has(id));
   if(partners.length!==2||rankOf(partners[0])!==rankOf(partners[1]))continue;
   partners.sort((a,b)=>(people.get(a)?.sex==='M'?0:people.get(a)?.sex==='F'?1:2)-(people.get(b)?.sex==='M'?0:people.get(b)?.sex==='F'?1:2));
   const uid='couple'+f.id,gap=38;
   const width=partners.reduce((n,id)=>n+cards.get(id).width,0)+gap;
   units.set(uid,{id:uid,members:partners,rank:rankOf(partners[0]),width,
     height:Math.max(...partners.map(id=>cards.get(id).height)),gap});
   for(const id of partners)owner.set(id,uid);
  }
  for(const id of cards.keys()){
   if(owner.has(id))continue;
   owner.set(id,id);
   units.set(id,{id,members:[id],rank:rankOf(id),width:cards.get(id).width,height:cards.get(id).height,gap:0});
  }
  // Stable paternal-before-maternal ancestry ordering, independent of Dagre's
  // layout ordering. It persists when a generation is opened or closed.
  const ancestryPaths=new Map([[D.rootId,'']]),queue=[D.rootId];
  for(let i=0;i<queue.length;i++){
   const id=queue[i],path=ancestryPaths.get(id);
   if(path.length>15)continue;
   const parents=[...(people.get(id)?.parents||[])].filter(id=>people.has(id));
   parents.sort((a,b)=>(people.get(a)?.sex==='M'?0:people.get(a)?.sex==='F'?1:2)-
                      (people.get(b)?.sex==='M'?0:people.get(b)?.sex==='F'?1:2));
   for(let j=0;j<parents.length;j++){
    const parent=parents[j],next=path+String(j);
    if(!ancestryPaths.has(parent)){
     ancestryPaths.set(parent,next);queue.push(parent);
    }
   }
  }
  const unitPath=u=>u.members.map(id=>ancestryPaths.get(id)).filter(x=>x!==undefined).sort()[0]??null;
  const byRank=new Map();
  for(const u of units.values()){
   if(!byRank.has(u.rank))byRank.set(u.rank,[]);
   byRank.get(u.rank).push(u);
  }
  const maxRank=Math.max(...byRank.keys());
  const positions=new Map();
  const getCardX=(u,id)=>{
   let x=positions.get(u.id)-u.width/2;
   for(const member of u.members){
    const card=cards.get(member);
    if(id===member)return x+card.width/2;
    x+=card.width+u.gap;
   }
   return positions.get(u.id);
  };
  // Place lower generations first. Each couple above gets a preferred centre
  // above its visible child, then a separation solver prevents overlapping
  // cards while preserving the left-right order of the pedigree.
  for(let level=0;level<=maxRank;level++){
   const items=byRank.get(level)||[];
   if(!items.length)continue;
   const info=items.map((u,index)=>{
    const core=!!unitPath(u);
    let preferred=null;
    if(level===0){
     preferred=u.members.includes(D.rootId)?0:(index+1)*(u.width+72);
    }else{
     const anchors=[];
     for(const id of u.members){
      for(const child of people.get(id)?.children||[]){
       const childUnit=units.get(owner.get(child));
       if(!childUnit||childUnit.rank>=level||!positions.has(childUnit.id))continue;
       const w=child===D.rootId||people.get(child)?.directAncestor?8:1;
       anchors.push([getCardX(childUnit,child),w]);
      }
     }
     if(anchors.length)preferred=anchors.reduce((sum,[x,w])=>sum+x*w,0)/anchors.reduce((sum,[x,w])=>sum+w,0);
    }
    return {u,preferred,core,path:unitPath(u),index};
   });
   for(const obj of info){
    if(obj.preferred!==null)continue;
    const others=info.filter(o=>o.preferred!==null);
    let anchor=null;
    for(const id of obj.u.members){
     const sibling=(people.get(id)?.siblings||[]).find(sid=>others.some(o=>o.u.members.includes(sid)));
     if(sibling){anchor=others.find(o=>o.u.members.includes(sibling));break;}
    }
    if(anchor){
     // A sibling of la personne de départ's father stays on the father's LEFT.
     // A sibling of his mother stays on the mother's RIGHT.
     const tiedToFather=obj.u.members.some(id=>(people.get(id)?.siblings||[]).includes(D.fatherId));
     const tiedToMother=obj.u.members.some(id=>(people.get(id)?.siblings||[]).includes(D.motherId));
     const side=tiedToFather?-1:tiedToMother?1:anchor.preferred<0?-1:1;
     obj.preferred=anchor.preferred+side*(anchor.u.width/2+obj.u.width/2+72);
    }else{
     const side=obj.u.members.some(id=>(people.get(id)?.branches||[]).includes('maternel'))?1:-1;
     obj.preferred=side*(480+obj.index*(obj.u.width+70));
    }
   }
   info.sort((a,b)=>a.preferred-b.preferred||
      ((a.path??'z').localeCompare(b.path??'z'))||a.u.id.localeCompare(b.u.id));
   // Weighted isotonic regression: minimum-space non-overlapping rank.
   const offsets=[0];
   for(let i=1;i<info.length;i++){
    offsets.push(offsets[i-1]+info[i-1].u.width/2+info[i].u.width/2+88);
   }
   const blocks=[];
   for(let i=0;i<info.length;i++){
    const w=info[i].u.members.includes(D.rootId)?300:info[i].core?9:1;
    const desired=info[i].preferred-offsets[i];
    blocks.push({start:i,end:i,weight:w,sum:desired*w});
    while(blocks.length>1){
     const right=blocks[blocks.length-1],left=blocks[blocks.length-2];
     if(left.sum/left.weight<=right.sum/right.weight)break;
     left.end=right.end;left.sum+=right.sum;left.weight+=right.weight;
     blocks.pop();
    }
   }
   for(const block of blocks){
    const y=block.sum/block.weight;
    for(let i=block.start;i<=block.end;i++)positions.set(info[i].u.id,y+offsets[i]);
   }
   const rootUnit=items.find(u=>u.members.includes(D.rootId));
   if(rootUnit){
    const dx=positions.get(rootUnit.id);
    for(const u of items)positions.set(u.id,positions.get(u.id)-dx);
   }
  }
  const g=new dagre.graphlib.Graph().setGraph({width:0,height:0}).setDefaultEdgeLabel(()=>({}));
  const rowGap=300,topGap=100;
  for(const u of units.values()){
   let left=positions.get(u.id)-u.width/2;
   const y=topGap+(maxRank-u.rank)*rowGap;
   for(const id of u.members){
    const card=cards.get(id);
    g.setNode(id,{...card,x:left+card.width/2,y});
    left+=card.width+u.gap;
   }
  }
  // Draw orthogonal connectors. Every family uses its own junction between
  // the parent and child ranks, without any diagonal inter-family crossings.
  const lanes=new Map(),buses=[];
  for(const f of D.families){
   const parents=f.partnerIds.filter(id=>cards.has(id)),
         kids=f.childIds.filter(id=>cards.has(id));
   if(!parents.length||(!kids.length&&parents.length<2))continue;
   const ps=parents.map(id=>g.node(id)),cs=kids.map(id=>g.node(id));
   const bottom=Math.max(...ps.map(n=>n.y+n.height/2));
   const childTop=cs.length?Math.min(...cs.map(n=>n.y-n.height/2)):bottom+210;
   if(childTop<bottom+30&&kids.length)continue;
   const key=Math.round(bottom/100)+':'+Math.round(childTop/100);
   const lane=lanes.get(key)||0;
   lanes.set(key,lane+1);
   const jy=Math.max(bottom+63,Math.min(childTop-65,bottom+85+(lane%3)*15));
   const jx=ps.reduce((sum,n)=>sum+n.x,0)/ps.length;
   const junction='union'+f.id;
   g.setNode(junction,{x:jx,y:jy,width:12,height:12,family:f});
   for(const id of parents){
    const n=g.node(id),start=n.y+n.height/2,turn=Math.min(jy-14,start+38);
    g.setEdge(id,junction,{kind:'partner',points:[{x:n.x,y:start},{x:n.x,y:turn},{x:jx,y:turn},{x:jx,y:jy}]});
   }
   if(kids.length>1){
    // One common horizontal bus for all children of this family,
    // instead of overlapping horizontal segments from every child.
    const turn=Math.max(jy+32,Math.min(childTop-36,jy+74));
    const allXs=[jx,...cs.map(n=>n.x)];
    buses.push({fid:f.id,jx,jy,turn,minX:Math.min(...allXs),maxX:Math.max(...allXs),
      major:f.partnerIds.some(id=>people.get(id)?.directAncestor)&&
            f.childIds.some(id=>id===D.rootId||people.get(id)?.directAncestor)});
    for(const id of kids){
     const n=g.node(id),end=n.y-n.height/2;
     g.setEdge(junction,id,{kind:'child',points:[{x:n.x,y:turn},{x:n.x,y:end}]});
    }
   }else{
    for(const id of kids){
     const n=g.node(id),end=n.y-n.height/2;
     const turn=Math.max(jy+27,Math.min(end-30,jy+65));
     g.setEdge(junction,id,{kind:'child',points:[{x:jx,y:jy},{x:jx,y:turn},{x:n.x,y:turn},{x:n.x,y:end}]});
    }
   }
  }
  const nodes=g.nodes().filter(id=>!g.node(id).family);
  const minX=Math.min(...nodes.map(id=>g.node(id).x-g.node(id).width/2));
  const maxX=Math.max(...nodes.map(id=>g.node(id).x+g.node(id).width/2));
  const shift=80-minX;
  for(const id of g.nodes())g.node(id).x+=shift;
  for(const e of g.edges())for(const p of g.edge(e).points)p.x+=shift;
  g.graph().width=maxX-minX+160;
  g.graph().busSegments=buses.map(b=>({...b,jx:b.jx+shift,minX:b.minX+shift,maxX:b.maxX+shift}));
  g.graph().height=Math.max(...g.nodes().map(id=>g.node(id).y+g.node(id).height/2))+80;
  return g;
 }

 function buildGraph(ids){
  if(directMode())return buildPedigreeGraph(ids);
  // Lay out a couple as one block, so two parents cannot be separated by entire branches.
  // Dagre only sees the blocks; the actual SVG still has one independent card per person.
  const cards=new Map();
  for(const id of ids){const p=people.get(id),lines=nodeLines(p);const etroit2=carteEtroite();cards.set(id,{width:etroit2?168:250,height:etroit2?Math.max(104,34+lines.name.length*18+(lines.birth.length+lines.death.length)*14):Math.max(124,40+lines.name.length*20+(lines.birth.length+lines.death.length)*16),person:p,lines});}
  const owner=new Map(),units=new Map();
  const orderedFamilies=[...D.families].sort((a,b)=>Number(b.partnerIds.includes(D.fatherId)&&b.partnerIds.includes(D.motherId))-Number(a.partnerIds.includes(D.fatherId)&&a.partnerIds.includes(D.motherId)));
  for(const f of orderedFamilies){
    let partners=f.partnerIds.filter(id=>cards.has(id));
    if(partners.length!==2||partners.some(id=>owner.has(id)))continue;
    if(partners.includes(D.fatherId)&&partners.includes(D.motherId))partners=[D.fatherId,D.motherId];
    const id='couple'+f.id, gap=42;
    units.set(id,{members:partners,width:cards.get(partners[0]).width+gap+cards.get(partners[1]).width,height:Math.max(...partners.map(p=>cards.get(p).height)),gap});
    for(const p of partners)owner.set(p,id);
  }
  for(const id of ids)if(!owner.has(id)){owner.set(id,id);units.set(id,{members:[id],width:cards.get(id).width,height:cards.get(id).height,gap:0});}
  const layout=new dagre.graphlib.Graph().setGraph({rankdir:'TB',nodesep:52,ranksep:200,marginx:64,marginy:64}).setDefaultEdgeLabel(()=>({}));
  for(const [id,u] of units)layout.setNode(id,{width:u.width,height:u.height});
  for(const f of D.families){
    const parents=f.partnerIds.filter(id=>cards.has(id)),kids=f.childIds.filter(id=>cards.has(id));
    for(const p of parents)for(const c of kids){const a=owner.get(p),b=owner.get(c);if(a!==b)layout.setEdge(a,b,{weight:3});}
  }

  // pont entre les deux lignées. Les liens proviennent des familles GEDCOM,
  // jamais du patronyme, de la couleur ni de la position des boîtes.
  const rootFamily=D.families.find(f=>f.childIds.includes(D.rootId)&&f.partnerIds.includes(D.fatherId)&&f.partnerIds.includes(D.motherId));
  const neighbours=new Map([...people.keys()].map(id=>[id,new Set()]));
  for(const f of D.families){
    if(rootFamily&&f.id===rootFamily.id)continue;
    const members=[...f.partnerIds,...f.childIds].filter(id=>people.has(id));
    for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++){
      neighbours.get(members[i]).add(members[j]);neighbours.get(members[j]).add(members[i]);
    }
  }
  const familyComponent=start=>{const seen=new Set([start]),queue=[start];for(let i=0;i<queue.length;i++)for(const id of neighbours.get(queue[i])||[])if(!seen.has(id)){seen.add(id);queue.push(id);}return seen;};
  const dadSide=familyComponent(D.fatherId),mumSide=familyComponent(D.motherId);
  const getSide=id=>id===D.rootId||!dadSide.has(id)&&!mumSide.has(id)?'centre':dadSide.has(id)&&!mumSide.has(id)?'paternel':mumSide.has(id)&&!dadSide.has(id)?'maternel':'centre';
  // Les grands-parents directs ont la priorité près de la ligne médiane.

  const fatherAncestors=ancestorDistance(D.fatherId),motherAncestors=ancestorDistance(D.motherId);
  const unitSide=u=>u.members.includes(D.fatherId)&&u.members.includes(D.motherId)?'centre':getSide(u.members[0]);
  const isAncestorUnit=(u,side)=>u.members.some(id=>(side==='paternel'?fatherAncestors:motherAncestors).has(id));
  const orderByOriginal=(a,b)=>layout.node(a.id).x-layout.node(b.id).x;
  const ranks=new Map();
  for(const [id,u] of units){
    const key=layout.node(id).y.toFixed(3);
    if(!ranks.has(key))ranks.set(key,[]);
    ranks.get(key).push({id,u,side:unitSide(u)});
  }
  const positions=new Map();
  for(const items of ranks.values()){
    // Keep the nuclear couple exactly centred, even with all generations open.
    for(const item of items){
      if(item.u.members.includes(D.fatherId)&&item.u.members.includes(D.motherId))positions.set(item.id,0);
      if(item.u.members.length===1&&item.u.members[0]===D.rootId)positions.set(item.id,0);
    }
    // Le noyau familial (la personne de départ et sa fratrie) dispose de sa propre place.
    // Les descendants de collatéraux ne doivent jamais le recouvrir.
    const neutral=items.filter(item=>item.side==='centre'&&!positions.has(item.id));
    neutral.sort(orderByOriginal);
    let centralRight=340;
    for(const item of neutral){positions.set(item.id,centralRight+item.u.width/2);centralRight+=item.u.width+48;}
    // Fratries et ascendants paternels : exclusivement à GAUCHE.
    const pat=items.filter(item=>item.side==='paternel');
    pat.sort((a,b)=>Number(isAncestorUnit(b.u,'paternel'))-Number(isAncestorUnit(a.u,'paternel'))||orderByOriginal(a,b));
    let rightEdge=-390;
    for(const item of pat){positions.set(item.id,rightEdge-item.u.width/2);rightEdge-=item.u.width+48;}
    // Fratries et ascendants maternels : exclusivement à DROITE.
    const mat=items.filter(item=>item.side==='maternel');
    mat.sort((a,b)=>Number(isAncestorUnit(b.u,'maternel'))-Number(isAncestorUnit(a.u,'maternel'))||orderByOriginal(a,b));
    let leftEdge=Math.max(390,neutral.length?centralRight:390);
    for(const item of mat){positions.set(item.id,leftEdge+item.u.width/2);leftEdge+=item.u.width+48;}
  }
  const g=new dagre.graphlib.Graph().setGraph({width:0,height:0}).setDefaultEdgeLabel(()=>({}));
  for(const [unitId,u] of units){
    const item=layout.node(unitId),centerX=positions.get(unitId)??0;
    let left=centerX-u.width/2;
    for(const id of u.members){const card=cards.get(id);g.setNode(id,{...card,x:left+card.width/2,y:item.y});left+=card.width+u.gap;}
  }
  const connectionLevels=new Map();
  for(const f of D.families){
    const parents=f.partnerIds.filter(id=>cards.has(id)),kids=f.childIds.filter(id=>cards.has(id));
    if(!parents.length||(!kids.length&&parents.length<2))continue;
    const ps=parents.map(id=>g.node(id)),cs=kids.map(id=>g.node(id));
    const bottom=Math.max(...ps.map(n=>n.y+n.height/2));
    const childTop=cs.length?Math.min(...cs.map(n=>n.y-n.height/2)):bottom+150;
    // Décalage de hauteur par union : les lignes ne prennent pas toutes
    // le même couloir. Le ranksep agrandi préserve plusieurs niveaux de trajet.
    const band=Math.round(bottom/80)+':'+Math.round(childTop/80);
    const lane=connectionLevels.get(band)||0;
    connectionLevels.set(band,lane+1);
    const availableTop=childTop-80;
    const jy=Math.max(bottom+70,Math.min(availableTop,bottom+106+(lane%6)*48));
    const jx=ps.reduce((sum,n)=>sum+n.x,0)/ps.length;
    const junction='union'+f.id;
    g.setNode(junction,{x:jx,y:jy,width:18,height:18,family:f});
    for(const [pi,id] of parents.entries()){
      const n=g.node(id),y=n.y+n.height/2;
      const turn=Math.max(y+32,Math.min(jy-24,y+45+pi*20));
      g.setEdge(id,junction,{kind:'partner',points:[{x:n.x,y},{x:n.x,y:turn},{x:jx,y:turn},{x:jx,y:jy}]});
    }
    for(const [ci,id] of kids.entries()){
      const n=g.node(id),y=n.y-n.height/2;
      const turn=Math.max(jy+28,Math.min(y-32,jy+48+ci*23));
      g.setEdge(junction,id,{kind:'child',points:[{x:jx,y:jy},{x:jx,y:turn},{x:n.x,y:turn},{x:n.x,y}]});
    }
  }
  // Conserve des coordonnées SVG positives pour l'export intégral.
  const personNodes=g.nodes().filter(id=>!g.node(id).family);
  const leftBound=Math.min(...personNodes.map(id=>g.node(id).x-g.node(id).width/2));
  const rightBound=Math.max(...personNodes.map(id=>g.node(id).x+g.node(id).width/2));
  const shiftX=48-leftBound;
  for(const id of g.nodes())g.node(id).x+=shiftX;
  for(const edge of g.edges())for(const pt of g.edge(edge).points)pt.x+=shiftX;
  g.graph().width=rightBound-leftBound+96;
  g.graph().height=Math.max(...g.nodes().map(id=>g.node(id).y+g.node(id).height/2))+48;
  return g;

   /* ===== v4 : courbes, animation et navigation ===== */
  let panAnim=null,panFallback=null,panTrace=[],panInertia=null,keysBound=false,firstRender=true;

  function cancelAnim(){
    if(panAnim){cancelAnimationFrame(panAnim);panAnim=null;}
    if(panFallback){clearTimeout(panFallback);panFallback=null;}
  }

  /* L'etat cible est DEJA applique par l'appelant : l'animation ne fait que
     rattraper visuellement. Une minuterie de secours garantit l'arrivee sur la
     cible meme si requestAnimationFrame ne tourne pas (onglet en arriere-plan). */
  function animateFrom(prev,target,duration){
    cancelAnim();
    const ms=Math.max(1,duration||300);
    const t0=performance.now();
    const ease=t=>1-Math.pow(1-t,3);
    const settle=()=>{
      cancelAnim();
      state.tx=target.tx;state.ty=target.ty;state.scale=target.scale;
      transform();
    };
    const step=now=>{
      const p=Math.min(1,(now-t0)/ms),k=ease(p);
      state.tx=prev.tx+(target.tx-prev.tx)*k;
      state.ty=prev.ty+(target.ty-prev.ty)*k;
      state.scale=prev.scale+(target.scale-prev.scale)*k;
      transform();
      if(p<1){panAnim=requestAnimationFrame(step);}else{panAnim=null;settle();}
    };
    panAnim=requestAnimationFrame(step);
    panFallback=setTimeout(settle,ms+200);
  }

  function resetPanTrace(){panTrace=[];}
  function pushPanSample(x,y){panTrace.push({x:x,y:y,t:performance.now()});if(panTrace.length>6)panTrace.shift();}
  function stopInertia(){if(panInertia){cancelAnimationFrame(panInertia);panInertia=null;}panTrace=[];}

  function startInertia(){
    if(reduceMotion())return;
    if(panInertia){cancelAnimationFrame(panInertia);panInertia=null;}
    if(panTrace.length<2)return;
    const a=panTrace[panTrace.length-2],b=panTrace[panTrace.length-1];
    const dt=Math.max(8,b.t-a.t);
    let vx=(b.x-a.x)/dt,vy=(b.y-a.y)/dt;
    if(Math.hypot(vx,vy)<0.12)return;
    const step=()=>{
      state.tx+=vx*16.7;state.ty+=vy*16.7;
      vx*=0.93;vy*=0.93;
      transform();
      if(Math.hypot(vx,vy)>0.02){panInertia=requestAnimationFrame(step);}else{panInertia=null;}
    };
    panInertia=requestAnimationFrame(step);
  }

  function ptR(v){return Math.round(v*100)/100;}

  /* Polyligne a coins arrondis (utilisee pour les barres horizontales). */
  function roundedPath(pts,r){
    if(!pts||pts.length<2)return '';
    const radius=r===undefined?18:r;
    if(pts.length===2)return 'M'+ptR(pts[0].x)+' '+ptR(pts[0].y)+'L'+ptR(pts[1].x)+' '+ptR(pts[1].y);
    let d='M'+ptR(pts[0].x)+' '+ptR(pts[0].y);
    for(let i=1;i<pts.length-1;i++){
      const p=pts[i],a=pts[i-1],b=pts[i+1];
      const v1x=p.x-a.x,v1y=p.y-a.y,v2x=b.x-p.x,v2y=b.y-p.y;
      const l1=Math.hypot(v1x,v1y)||1,l2=Math.hypot(v2x,v2y)||1;
      const r1=Math.min(radius,l1/2),r2=Math.min(radius,l2/2);
      const q1x=p.x-v1x/l1*r1,q1y=p.y-v1y/l1*r1;
      const q2x=p.x+v2x/l2*r2,q2y=p.y+v2y/l2*r2;
      d+='L'+ptR(q1x)+' '+ptR(q1y)+'Q'+ptR(p.x)+' '+ptR(p.y)+' '+ptR(q2x)+' '+ptR(q2y);
    }
    const last=pts[pts.length-1];
    return d+'L'+ptR(last.x)+' '+ptR(last.y);
  }

  /* Liaison parent -> union -> enfant : courbe en S (tangentes verticales). */
  function curvePath(pts){
    if(!pts||pts.length<2)return '';
    const a=pts[0],b=pts[pts.length-1];
    const dy=b.y-a.y;
    if(pts.length===2||Math.abs(dy)<2)return roundedPath(pts,14);
    const k=Math.max(16,Math.abs(dy)*0.5);
    return 'M'+ptR(a.x)+' '+ptR(a.y)+'C'+ptR(a.x)+' '+ptR(a.y+k)+' '+ptR(b.x)+' '+ptR(b.y-k)+' '+ptR(b.x)+' '+ptR(b.y);
  }

  /* Plus court chemin familial entre une personne et la personne de départ (BFS sur les familles). */
  function pathToRoot(target){
    const rootId=D.rootId;
    if(target===rootId)return {nodes:new Set([rootId]),families:new Set()};
    const seen=new Map([[target,null]]);
    const queue=[target];
    for(let i=0;i<queue.length;i++){
      const cur=queue[i];
      const links=[];
      for(const f of D.families){
        const isChild=f.childIds.includes(cur),isPartner=f.partnerIds.includes(cur);
        if(!isChild&&!isPartner)continue;
        if(isChild){
          for(const par of f.partnerIds)links.push([par,f.id]);
          for(const sib of f.childIds)if(sib!==cur)links.push([sib,f.id]);
        }
        if(isPartner){
          for(const other of f.partnerIds)if(other!==cur)links.push([other,f.id]);
          for(const kid of f.childIds)links.push([kid,f.id]);
        }
      }
      for(const pair of links){
        const nb=pair[0],fid=pair[1];
        if(seen.has(nb))continue;
        seen.set(nb,{from:cur,fid:fid});
        if(nb===rootId){
          const nodes=new Set([rootId]),families=new Set();
          let walk=rootId,guard=0;
          while(seen.get(walk)&&guard++<2000){
            const step=seen.get(walk);
            nodes.add(step.from);families.add(step.fid);walk=step.from;
          }
          return {nodes:nodes,families:families};
        }
        queue.push(nb);
      }
    }
    return {nodes:new Set([target]),families:new Set()};
  }

  const DEFAULT_COMPANIONS=(people.get(D.rootId)?.siblings||[]).slice(0,1);   /* personne associée à la racine, choisie dans les données */
  const GED_MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let editUnlocked=false;

  function gedDate(value){
    const m=/^([0-9]{4})(?:-([0-9]{2})(?:-([0-9]{2}))?)?$/.exec(String(value||'').trim());
    if(!m)return String(value||'').toUpperCase();
    if(!m[2])return m[1];
    const mon=GED_MONTHS[Number(m[2])-1]||'';
    return (m[3]?Number(m[3])+' ':'')+mon+' '+m[1];
  }

  function isoFromGed(value){
    const m=/^(?:([0-9]{1,2}) )?([A-Z]{3}) ([0-9]{4})$/.exec(String(value||'').toUpperCase());
    if(!m)return /^[0-9]{4}$/.test(value||'')?value:'';
    const mon=GED_MONTHS.indexOf(m[2])+1;
    if(mon<1)return m[3];
    const mm=('0'+mon).slice(-2);
    return m[1]?m[3]+'-'+mm+'-'+('0'+m[1]).slice(-2):m[3]+'-'+mm;
  }

  function pushUnique(list,value){

  /* Ajoute une proposition de la famille dans le modele, avant le premier rendu. */
  const graphesMemo=new Map();
  function graphesCle(ids){return (directMode()?'D':'N')+'|'+[...ids].sort().join(',');}
  function buildGraphMemo(ids){
    const cle=graphesCle(ids);
    const garde=graphesMemo.get(cle);
    if(garde)return garde;
    const g=buildGraph(ids);
    graphesMemo.set(cle,g);
    if(graphesMemo.size>4)graphesMemo.delete(graphesMemo.keys().next().value);
    return g;
  }

  function applyContributions(items){viderMemoireGraphes();
    if(!Array.isArray(items))return;
    contributionItems=items;
    for(const it of items){
      if(it.kind==='edit'){
        const target=people.get(it.targetId);
        if(!target)continue;
        target.birth=target.birth||{date:'',place:'',known:false};
        target.death=target.death||{date:'',place:'',known:false};
        if(it.birthDate===null){target.birth.date='';target.birth.known=false;}else if(it.birthDate){target.birth.date=gedDate(it.birthDate);target.birth.known=true;}
        if(it.birthPlace===null)target.birth.place='';else if(it.birthPlace)target.birth.place=it.birthPlace;
        if(it.deathDate===null){target.death.date='';target.death.known=false;}else if(it.deathDate){target.death.date=gedDate(it.deathDate);target.death.known=true;}
        if(it.deathPlace===null)target.death.place='';else if(it.deathPlace)target.death.place=it.deathPlace;
        if(it.given===null)target.givenName='';else if(it.given)target.givenName=it.given;
        if(it.surname===null)target.surname='';else if(it.surname)target.surname=it.surname;
        if(it.given!==undefined||it.surname!==undefined)target.name=[target.givenName,target.surname].filter(Boolean).join(' ').trim()||target.name;
        target.familyEdited=true;
        target.familyEditIds=(target.familyEditIds||[]).concat([it.id]);
        if(it.author)target.familyEditAuthor=it.author;
        continue;
      }
      const anchor=people.get(it.anchorId);
      if(!anchor)continue;
      const id='con-'+it.id;
      if(people.has(id))continue;
      const label=[it.given,it.surname].filter(Boolean).join(' ').trim()||'Personne ajoutee';
      const birthDate=gedDate(it.birthDate),deathDate=gedDate(it.deathDate);
      const person={
        id:id,name:label,givenName:it.given||label,surname:it.surname||'',gedcomName:label,
        sex:it.sex==='M'?'M':it.sex==='F'?'F':'U',
        birth:{date:birthDate,place:it.birthPlace||'',known:!!birthDate,sourceLine:null},
        death:{date:deathDate,place:it.deathPlace||'',known:!!deathDate,sourceLine:null},
        events:[],citations:[],siblings:[],siblingDetails:[],
        branches:[anchor.branch||'allies'],branch:'allies',
        connectedToRoot:false,relationDistance:null,
        generation:typeof anchor.generation==='number'?anchor.generation:0,
        ancestorDepth:null,directAncestor:false,relationRole:'contribution',
        parents:[],children:[],partners:[],parentFamilyIds:[],spouseFamilyIds:[],
        contributed:true,contributionId:it.id,contributionNote:it.note||'',contributionAuthor:it.author||''
      };

      let family=null;
      if(it.relation==='partner'){
        family=(anchor.spouseFamilyIds||[]).map(fid=>families.get(fid)).find(Boolean)||null;
        if(!family){family=emptyFamily('confam-'+it.id);families.set(family.id,family);familyList().push(family);}
        pushUnique(family.partnerIds,anchor.id);
        pushUnique(family.partnerIds,id);
        pushUnique(person.spouseFamilyIds,family.id);
        pushUnique(anchor.spouseFamilyIds,family.id);
        pushUnique(person.partners,anchor.id);
        pushUnique(anchor.partners,id);
      }else if(it.relation==='child'){
        family=(anchor.spouseFamilyIds||[]).map(fid=>families.get(fid)).find(Boolean)||null;
        if(!family){family=emptyFamily('confam-'+it.id);families.set(family.id,family);familyList().push(family);}
        pushUnique(family.partnerIds,anchor.id);
        pushUnique(family.childIds,id);
        pushUnique(person.parentFamilyIds,family.id);
        for(const parentId of family.partnerIds){
          const parent=people.get(parentId);
          if(parent){pushUnique(person.parents,parentId);pushUnique(parent.children,id);}
        }
        for(const otherId of family.childIds){
          if(otherId===id)continue;
          const other=people.get(otherId);
          if(other){pushUnique(person.siblings,otherId);pushUnique(other.siblings,id);}
        }
      }else{
        family=familyList().find(f=>Array.isArray(f.childIds)&&f.childIds.indexOf(anchor.id)>=0)||null;
        if(!family){family=emptyFamily('confam-'+it.id);families.set(family.id,family);familyList().push(family);pushUnique(family.childIds,anchor.id);pushUnique(anchor.parentFamilyIds,family.id);}
        pushUnique(family.partnerIds,id);
        pushUnique(person.spouseFamilyIds,family.id);
        pushUnique(person.children,anchor.id);
        pushUnique(anchor.parents,id);
        for(const otherId of family.partnerIds){
          if(otherId===id)continue;
          const other=people.get(otherId);
          if(other){pushUnique(person.partners,otherId);pushUnique(other.partners,id);}
        }
      }

      people.set(id,person);
      D.people.push(person);
    }
  }

  function gedYear(value){

  function marriageYears(family){
    if(!family||!family.marriage||!family.marriage.exists)return null;
    const start=gedYear(family.marriage.date);
    if(!start)return null;
    const divorce=(family.events||[]).find(event=>event&&event.type==='DIV');
    let end=new Date().getFullYear(),ended=false;
    if(divorce){const dy=gedYear(divorce.date);if(dy){end=dy;ended=true;}}
    if(!ended)for(const pid of family.partnerIds||[]){
      const person=people.get(pid);
      const deathYear=person&&person.death&&person.death.known?gedYear(person.death.date):null;
      if(deathYear&&deathYear<end){end=deathYear;ended=true;}
    }
    const years=end-start;
    return years>=0?years:null;
  }

  function marriageText(family){
    const years=marriageYears(family);
    if(years===null)return '';
    if(years===0)return 'Mariage : moins d\u2019un an';
    const label=years+(years>1?' ans de mariage':' an de mariage');
    const divorce=(family.events||[]).some(event=>event&&event.type==='DIV');

  function ageSuffix(person){
    const birthYear=person&&person.birth?gedYear(person.birth.date):null;

    const died=person.death&&person.death.known;
    const endYear=died?gedYear(person.death.date):new Date().getFullYear();

    const years=endYear-birthYear;

  function arbreCourantModifiableLocalement(){
    try{
      const registre=JSON.parse(localStorage.getItem('arbres.v1')||'null');
      const arbre=registre&&registre.arbres&&registre.arbres[registre.courant];
      return !!(arbre&&arbre.modificationsLocales===true);
    }catch(error){return false;}
  }

  function enregistrerArbreCourantLocalement(){ const brut=localStorage.getItem('arbres.v1'); if(!brut)throw new Error('Le registre des arbres est introuvable.'); const registre=JSON.parse(brut); const arbre=registre&&registre.arbres&&registre.arbres[registre.courant]; if(!arbre||arbre.modificationsLocales!==true)throw new Error('Cet arbre ne permet pas la modification locale.'); arbre.donnees=JSON.parse(JSON.stringify(D)); localStorage.setItem('arbres.v1',JSON.stringify(registre)); } function verifierDateSaisieLocale(value,label){ if(!value)return; const match=String(value).match(/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/); if(!match)throw new Error(label+' : utilise AAAA, AAAA-MM ou AAAA-MM-JJ.'); if(+match[1]<1)throw new Error(label+' : l’année est invalide.'); if(match[2]&&(+match[2]<1||+match[2]>12))throw new Error(label+' : le mois est invalide.'); if(match[3]){const annee=+match[1],mois=+match[2],jour=+match[3],bissextile=annee%4===0&&(annee%100!==0||annee%400===0),jours=[31,bissextile?29:28,31,30,31,30,31,31,30,31,30,31][mois-1];if(jour<1||jour>jours)throw new Error(label+' : la date est invalide.');} } function enregistrerCorrectionLocale(personId,after,note){
    const texte=localStorage.getItem('arbres.v1');
    if(!texte)throw new Error('Le registre des arbres est introuvable.');
    const registre=JSON.parse(texte);
    const arbre=registre&&registre.arbres&&registre.arbres[registre.courant];
    if(!arbre||arbre.modificationsLocales!==true)throw new Error('Cet arbre ne permet pas la modification locale.');
    const copie=JSON.parse(JSON.stringify(registre));
    const cible=copie.arbres[copie.courant].donnees.people.find(personne=>String(personne.id)===String(personId));
    if(!cible)throw new Error('La personne n’existe plus dans cet arbre.');
    if(!after.given&&!after.surname)throw new Error('Conserve au moins un prénom ou un nom.');
    function verifierDate(value,label){
      if(!value)return;
      const match=value.match(/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/);
      if(!match)throw new Error(label+' : utilise AAAA, AAAA-MM ou AAAA-MM-JJ.');
      if(+match[1]<1)throw new Error(label+' : l’année est invalide.');
      if(match[2]&&(+match[2]<1||+match[2]>12))throw new Error(label+' : le mois est invalide.');
      if(match[3]){const annee=+match[1],mois=+match[2],jour=+match[3],bissextile=annee%4===0&&(annee%100!==0||annee%400===0),jours=[31,bissextile?29:28,31,30,31,30,31,31,30,31,30,31][mois-1];if(jour<1||jour>jours)throw new Error(label+' : la date est invalide.');}
    }
    verifierDate(after.birthDate,'Naissance');verifierDate(after.deathDate,'Décès');
    function mettreAJourEvenement(type,date,place){
      cible.events=Array.isArray(cible.events)?cible.events:[];
      let event=cible.events.find(item=>item&&item.type===type);
      if(!event){if(!date&&!place)return;event={type:type,value:'',description:'',notes:[],citations:[],photos:[],sourceLine:null};cible.events.push(event);}
      event.date=date?gedDate(date):'';event.dateRaw='';event.place=place||'';
    }
    cible.givenName=after.given;cible.surname=after.surname;
    cible.name=[after.given,after.surname].filter(Boolean).join(' ').trim();
    cible.gedcomName=after.surname?after.given+' /'+after.surname+'/':after.given;
    cible.birth=cible.birth||{date:'',place:'',known:false};
    cible.birth.date=after.birthDate||'';cible.birth.place=after.birthPlace;cible.birth.known=!!after.birthDate;cible.birth.dateRaw='';
    cible.death=cible.death||{date:'',place:'',known:false};
    cible.death.date=after.deathDate||'';cible.death.place=after.deathPlace;cible.death.known=!!(after.deathDate||after.deathPlace);cible.death.dateRaw='';
    mettreAJourEvenement('BIRT',after.birthDate,after.birthPlace);
    mettreAJourEvenement('DEAT',after.deathDate,after.deathPlace);
    if(note){cible.notes=Array.isArray(cible.notes)?cible.notes:[];if(!cible.notes.includes(note))cible.notes.push(note);}
    localStorage.setItem('arbres.v1',JSON.stringify(copie));
  }

  const DEPTH_STEPS=[2,3,4,6,99];

  function depthLabel(value){
    return value===99?'Toutes les générations':(value+1)+' générations';
  }

  function setupDepthStepper(){
    const select=el('depth');
    if(!select||el('depthplus'))return;
    const control=select.closest('.generation-control')||select;
    const host=control.parentNode;
    if(!host)return;
    const build=(id,glyph,delta,label)=>{
      const button=document.createElement('button');
      button.className='btn depth-step';
      button.id=id;
      button.type='button';
      button.textContent=glyph;
      button.title=label;
      button.setAttribute('aria-label',label);
      button.onclick=()=>{
        const current=Number(select.value)||2;
        let index=DEPTH_STEPS.indexOf(current);
        if(index<0)index=0;
        const next=DEPTH_STEPS[Math.max(0,Math.min(DEPTH_STEPS.length-1,index+delta))];
        if(next===current)return;
        select.value=String(next);
        select.dispatchEvent(new Event('change',{bubbles:true}));
        toast('Affichage : '+depthLabel(next)+'.');
      };
      return button;
    };
    const minus=build('depthminus','−',-1,'Refermer une génération');
    const plus=build('depthplus','＋',1,'Ouvrir une génération de plus');
    host.insertBefore(minus,control);
    host.insertBefore(plus,control.nextSibling);
  }

<style id="page-figee">
/* L'application tient dans l'écran : plus de defilement de page, donc plus de
   traits qui se decrochent. L'arbre gere son propre deplacement.
   En dessous de 900 px de large on revient au defilement normal. */
@media (min-width: 901px) {
  html, body { height: 100%; overflow: hidden; }
  .shell { height: 100vh; height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .layout { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .layout > aside { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .layout > .main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 18px; }
  .main > .heading, .main > .toolbar, .main > .legend { flex: 0 0 auto; }
  .main > .canvas { flex: 1 1 auto; height: auto; min-height: 0; }
}
</style>

<style id="place-pour-l-arbre">
/* On ne retrecit pas l'arbre : on libere la place au-dessus.
   Le titre, le sous-titre et les trois compteurs partent ; le choix du nombre
   de generations et la barre d'outils restent. */
@media (min-width: 901px) {
  .main > .heading > div { display: none; }
  .main > .heading { justify-content: flex-end; margin: 0 0 6px; padding: 0; min-height: 0; }
  .main > .metrics { display: none; }
  .main > .toolbar { margin: 0 0 10px; }
  .main > .canvas { flex: 1 1 auto; height: auto; min-height: 0; }
  .main { padding-top: 10px; }
}
</style>

<style id="sans-compteurs">
.metrics, .main .metrics, main .metrics { display: none !important; }
@media (min-width: 901px) {
  .main > .heading { justify-content: flex-end !important; margin: 0 0 6px !important; }
  .main > .toolbar { margin: 0 0 10px !important; }
}
</style>

<style id="sans-aides">
/* Les trois blocs d'aide partent : la ligne d'explication au-dessus de l'arbre

@media (min-width: 901px) {
  .main > .canvas { flex: 1 1 auto; height: auto; min-height: 0; }

}
</style>

<script id="gestion-arbres">(function(){
  var CLE = 'arbres.v1';
  function lire(){ try { return JSON.parse(localStorage.getItem(CLE)); } catch(e){ return null; } }
  function ecrire(o){ try { localStorage.setItem(CLE, JSON.stringify(o)); return true; } catch(e){ alert("La mémoire du navigateur est pleine : l'arbre n'a pas pu être enregistré."); return false; } }
  function nouvelIdMedia(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}return 'media-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
  var etat = lire();
  if (!etat || !etat.arbres || !etat.arbres.length) {
    etat = { courant: 0, arbres: [{ nom: 'Arbre de démonstration', donnees: window.FAMILY_DATA, mediaId: nouvelIdMedia(), modificationsLocales: true }] };
    ecrire(etat);
  }

  var mediasModifies=false;

// « 23 FEB 1937 » -> 1937-02-23 ; « 1937 » -> 1937 ; le reste -> ''
function normaliserDate(brut) {
  if (!brut) return '';

<div id="consultation" hidden>
  <div class="consult-entete">
    <h2>Toutes les fiches</h2>
    <button type="button" id="consult-fermer" aria-label="Fermer">×</button>
  </div>
  <div class="consult-filtres">
    <input id="consult-recherche" type="search" placeholder="Chercher un nom, un lieu, une année…" aria-label="Chercher une fiche">
    <select id="consult-tri" aria-label="Trier par">
      <option value="naissance">Tri : date de naissance</option>
      <option value="deces">Tri : date de décès</option>
      <option value="nom">Tri : nom</option>
    </select>
    <select id="consult-filtre" aria-label="Filtrer">
      <option value="tous">Tous</option>
      <option value="vivants">Vivants</option>
      <option value="decedes">Décédés</option>
      <option value="sans-date">Sans date</option>
    </select>
    <span id="consult-compte" class="consult-compte"></span>
  </div>
  <div id="consult-liste" role="list"></div>
</div>
<style id="page-consultation">

    position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column;
    background: var(--papier, #161a21); color: var(--ink, #eaeef5);
  }
  #consultation[hidden] { display: none; }
  .consult-entete { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line, #2b3444); }
  .consult-entete h2 { margin: 0; font-size: 22px; font: 600 22px/1.2 Georgia, serif; }
  .consult-entete button { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line, #2b3444); background: transparent; color: inherit; font-size: 24px; cursor: pointer; }
  .consult-filtres { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line, #2b3444); }
  .consult-filtres input, .consult-filtres select { min-height: 42px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line, #2b3444); background: transparent; color: inherit; font: inherit; font-size: 15px; }
  .consult-filtres input { flex: 1 1 260px; }

  #consult-liste { flex: 1 1 auto; overflow-y: auto; padding: 8px 20px 40px; }

  .consult-ligne:hover { background: rgba(255,255,255,.04); }
  .consult-nom { font-size: 16px; font-weight: 600; }
  .consult-dates { font-size: 13.5px; opacity: .8; }

  .consult-vide { padding: 30px 4px; opacity: .7; }

<script id="script-consultation">(function(){
  var D = window.FAMILY_DATA;
  if (!D || !D.people) return;

  /* ---------- les liens, deduits des familles ---------- */
  var pere = {}, mere = {}, conjoints = {}, enfants = {};
  (D.families || []).forEach(function(f){
    var ps = f.partnerIds || [];
    ps.forEach(function(a){ ps.forEach(function(b){ if (a !== b) { (conjoints[a] = conjoints[a] || {})[b] = 1; } }); });
    (f.childIds || []).forEach(function(c){
      if (ps[0]) { if (ps.length === 1 && f.singleParentRole === 'mere') mere[c] = ps[0]; else pere[c] = ps[0]; (enfants[ps[0]] = enfants[ps[0]] || []).push(c); }
      if (ps[1]) { mere[c] = ps[1]; (enfants[ps[1]] = enfants[ps[1]] || []).push(c); }
    });
  });
  var parId = {};
  D.people.forEach(function(p){ parId[p.id] = p; });
  var racine = D.rootId;
  if (!parId[racine]) { racine = D.people[0] && D.people[0].id; }

  function voisins(id){
    var l = [];
    if (pere[id]) l.push([pere[id], 'haut']);
    if (mere[id]) l.push([mere[id], 'haut']);
    (enfants[id] || []).forEach(function(e){ l.push([e, 'bas']); });
    Object.keys(conjoints[id] || {}).forEach(function(c){ l.push([c, 'conjoint']); });
    return l;
  }

  function chemin(a, b){
    if (a === b) return [];
    var vus = {}; vus[a] = 1;
    var file = [[a, []]];
    while (file.length) {
      var item = file.shift(); var courant = item[0]; var etapes = item[1];
      if (etapes.length > 24) continue;
      var v = voisins(courant);
      for (var i = 0; i < v.length; i++) {
        if (vus[v[i][0]]) continue;
        var suite = etapes.concat([[v[i][0], v[i][1]]]);
        if (v[i][0] === b) return suite;
        vus[v[i][0]] = 1;
        file.push([v[i][0], suite]);
      }
    }
    return null;
  }

  function mot(sexe, m, f, n){ return sexe === 'M' ? m : sexe === 'F' ? f : (n || m); }

  function libelle(n, p, sexe){
    if (n === 0 && p === 0) return "C'est vous";
    if (n === 0) {
      if (p === 1) return mot(sexe, 'votre fils', 'votre fille', 'votre enfant');
      if (p === 2) return mot(sexe, 'votre petit-fils', 'votre petite-fille', 'votre petit-enfant');
      return mot(sexe, 'votre descendant', 'votre descendante', 'votre descendant');
    }
    if (p === 0) {
      if (n === 1) return mot(sexe, 'votre père', 'votre mère', 'votre parent');
      if (n === 2) return mot(sexe, 'votre grand-père', 'votre grand-mère', 'votre grand-parent');
      if (n === 3) return mot(sexe, 'votre arrière-grand-père', 'votre arrière-grand-mère', 'votre arrière-grand-parent');
      return 'votre ancêtre de la ' + n + 'e génération';
    }
    if (n === 1 && p === 1) return mot(sexe, 'votre frère', 'votre sœur', 'votre frère ou sœur');
    if (n === 2 && p === 1) return mot(sexe, 'votre oncle', 'votre tante', 'votre oncle ou tante');
    if (n === 1 && p === 2) return mot(sexe, 'votre neveu', 'votre nièce', 'votre neveu ou nièce');
    if (n === 2 && p === 2) return mot(sexe, 'votre cousin germain', 'votre cousine germaine', 'votre cousin germain');
    if (n === 3 && p === 3) return mot(sexe, 'votre cousin issu de germain', 'votre cousine issue de germain', 'votre cousin issu de germain');
    if (n === p && n >= 4) return mot(sexe, 'votre cousin au ' + (n - 1) + 'e degré', 'votre cousine au ' + (n - 1) + 'e degré', 'votre cousin éloigné');
    if (n >= 2 && p >= 2) return mot(sexe, 'votre cousin éloigné', 'votre cousine éloignée', 'votre cousin éloigné');
    if (n === 1) return mot(sexe, 'votre neveu éloigné', 'votre nièce éloignée', 'votre neveu éloigné');
    if (p === 1) return mot(sexe, 'votre oncle éloigné', 'votre tante éloignée', 'votre oncle éloigné');
    return 'votre parent éloigné';
  }

  function parente(id){
    var cible = parId[id];
    if (!cible || !racine) return '';
    if (id === racine) return "C'est vous";
    var etapes = chemin(racine, id);
    if (!etapes) return 'sans lien connu';
    var sens = etapes.map(function(e){ return e[1]; });
    if (sens.indexOf('conjoint') >= 0) {
      if (sens.length === 1) return mot(cible.sex, 'votre époux', 'votre épouse', 'votre conjoint');

        var avant = sens.slice(0, -1);
        var ha = avant.filter(function(s){ return s === 'haut'; }).length;
        var ba = avant.filter(function(s){ return s === 'bas'; }).length;
        if (avant.length === ha + ba) {
          if (ha === 1 && ba === 0) return mot(cible.sex, 'votre beau-père', 'votre belle-mère', 'le conjoint de votre parent');
          if (ha === 0 && ba === 1) return mot(cible.sex, 'votre gendre', 'votre belle-fille', 'le conjoint de votre enfant');
          if (ha === 1 && ba === 1) return mot(cible.sex, 'votre beau-frère', 'votre belle-sœur', 'le conjoint de votre frère ou sœur');

      }

  });

  var zone = document.getElementById('consultation');
  var liste = document.getElementById('consult-liste');
  var recherche = document.getElementById('consult-recherche');
  var tri = document.getElementById('consult-tri');
  var filtre = document.getElementById('consult-filtre');
  var compte = document.getElementById('consult-compte');

  function dessiner(){
    var q = (recherche.value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    var f = filtre.value;
    var vus = lignes.filter(function(l){
      if (f === 'vivants' && l.deces) return false;
      if (f === 'decedes' && !l.deces) return false;
      if (f === 'sans-date' && (l.naissance || l.deces)) return false;
      if (!q) return true;
      var texte = (l.nom + ' ' + l.lieu + ' ' + l.naissance + ' ' + l.deces).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return texte.indexOf(q) >= 0;
    });
    var mode = tri.value;
    vus.sort(function(a, b){
      if (mode === 'nom') return a.nom.localeCompare(b.nom, 'fr');
      var cle = mode === 'deces' ? 'deces' : 'naissance';
      var xa = annee(a[cle]), xb = annee(b[cle]);
      if (xa === null && xb === null) return a.nom.localeCompare(b.nom, 'fr');
      if (xa === null) return 1;
      if (xb === null) return -1;
      return xa - xb || a.nom.localeCompare(b.nom, 'fr');
    });
    compte.textContent = vus.length + ' fiche' + (vus.length > 1 ? 's' : '');
    liste.replaceChildren();
    if (!vus.length) {
      var vide = document.createElement('p'); vide.className = 'consult-vide';
      vide.textContent = 'Aucune fiche ne correspond.';
      liste.appendChild(vide); return;
    }
    var fragment = document.createDocumentFragment();
    vus.slice(0, 800).forEach(function(l){
      var ligne = document.createElement('div');
      ligne.className = 'consult-ligne'; ligne.setAttribute('role', 'listitem');
      var gauche = document.createElement('div');
      var nom = document.createElement('div'); nom.className = 'consult-nom'; nom.textContent = l.nom;
      var dates = document.createElement('div'); dates.className = 'consult-dates';
      var morceaux = [];
      if (l.naissance) morceaux.push('° ' + dateLisible(l.naissance));
      if (l.deces) morceaux.push('† ' + dateLisible(l.deces));
      if (l.lieu) morceaux.push(l.lieu);
      dates.textContent = morceaux.join(' · ') || 'dates inconnues';
      gauche.appendChild(nom); gauche.appendChild(dates);
      var lien = document.createElement('div'); lien.className = 'consult-parente'; lien.textContent = parente(l.p.id);
      ligne.appendChild(gauche); ligne.appendChild(lien);
      ligne.addEventListener('click', function(){
        var carte = document.querySelector('[data-id="' + l.p.id + '"], [data-person="' + l.p.id + '"]');
        if (carte) { carte.dispatchEvent(new MouseEvent('click', { bubbles: true })); zone.hidden = true; }
      });
      fragment.appendChild(ligne);
    });

  }

  recherche.addEventListener('input', dessiner);
  tri.addEventListener('change', dessiner);
  filtre.addEventListener('change', dessiner);
  document.getElementById('consult-fermer').addEventListener('click', function(){ zone.hidden = true; });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !zone.hidden) zone.hidden = true; });

  // Un bouton pour ouvrir la page, place dans la colonne de gauche.
  function bouton(){

    b.style.cssText = 'width:100%;min-height:40px;margin-top:8px;font-size:14px;text-align:left';

    var arbres = aside.querySelector('.arbres');
    if (arbres) arbres.appendChild(b); else aside.appendChild(b);

  var essais = 0;
  function poser(){ if (document.querySelector('aside')) { bouton(); return; } if (essais++ < 60) setTimeout(poser, 150); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', poser); else poser();
})();</script>

<script id="masquer-reperes">
/* Les reperes de generation ("Grands-parents", "Parents", "Sa generation") sont
   peints a gauche et passent derriere les cartes sur telephone : ils rendent la
   vue illisible. On les masque par leur texte, quel que soit le tiret utilise. */
(function(){
  var MOTIF = /^(grands[\s\-\u2010-\u2015]*parents|parents|sa\s*g[eé]n[eé]ration|arri[eè]re[\s\-\u2010-\u2015]*grands[\s\-\u2010-\u2015]*parents)$/i;
  function masquer(){
    if (!window.matchMedia('(max-width: 850px)').matches) return;
    var n = 0;
    var els = document.querySelectorAll('svg text, svg tspan, .canvas div, .canvas span, .canvas p, .canvas h2, .canvas h3');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      var t = (e.textContent || '').replace(/\s+/g, ' ').trim();
      if (t.length && t.length < 32 && MOTIF.test(t)) {
        e.style.display = 'none';
        e.style.visibility = 'hidden';
        n++;
      }
    }
    return n;
  }
  function lancer(){ masquer(); setTimeout(masquer, 400); setTimeout(masquer, 1200); setTimeout(masquer, 2500); setTimeout(masquer, 4000); }
  window.addEventListener('load', lancer);
  window.addEventListener('resize', lancer);
  document.addEventListener('click', function(){ setTimeout(masquer, 600); }, true);
})();
</script>
<script id="masquer-reperes-2">
/* Les reperes de generation sont recrees a chaque rendu de l'arbre : un simple
   minuteur ne suffit pas. Un observateur les masque des qu'ils apparaissent. */
(function(){
  var MOTIF = /^(grands[\s\-\u2010-\u2015]*parents|parents|sa\s*g[eé]n[eé]ration|arri[eè]re[\s\-\u2010-\u2015]*grands[\s\-\u2010-\u2015]*parents)$/i;
  var cache = new WeakSet();
  function masquer(){
    if (document.documentElement.clientWidth > 850) return;
    var els = document.querySelectorAll('.canvas *, svg *');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (cache.has(e)) continue;
      var t = (e.textContent || '').replace(/\s+/g, ' ').trim();
      if (t.length && t.length < 32 && MOTIF.test(t) && !e.querySelector('*')) {
        e.style.setProperty('display', 'none', 'important');
        e.style.setProperty('visibility', 'hidden', 'important');
        cache.add(e);

  }

  function demarrer(){

  window.addEventListener('resize', masquer);
})();

      if(!shell)return false;
      if(document.getElementById('lien-arbre'))return;
      var a=document.createElement('a');
      a.id='lien-arbre';a.className='lien-evitement';a.href='#canvas';
      a.textContent="Aller a l'arbre";
      a.addEventListener('click',function(ev){
        ev.preventDefault();

    });
  }

  /* --- hors ligne : sans service worker, une coupure reseau suivie d'un
        rechargement donnait une page blanche --- */
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});

  /* --- confort de lecture et aide en francais simple ----------------------
     Deux besoins d'un public peu a l'aise : voir assez grand, et savoir ou
     cliquer. Le confort agit sur l'echelle d'ouverture de chaque vue, donc
     sur la taille reelle du texte et des cartes ; le choix est conserve. --- */
  var THEME_COULEURS={papier:'#f6f5f0',ivoire:'#faf7f0',sepia:'#f2e9d6',sauge:'#edf2ea',nuit:'#1b1d1a',graphite:'#1c1c1c',ardoise:'#171b22',contraste:'#ffffff'};
  var THEME_NOMS={papier:"Papier",ivoire:"Ivoire",sepia:"S\u00e9pia",sauge:"Sauge",nuit:"Nuit",graphite:"Graphite",ardoise:"Ardoise",contraste:"Contraste"};
  var THEME_APERCU={papier:"#f6f5f0",ivoire:"#faf7f0",sepia:"#f2e9d6",sauge:"#edf2ea",nuit:"#1b1d1a",graphite:"#1c1c1c",ardoise:"#171b22",contraste:"#ffffff"};
  function themeEnregistre(){try{var t=localStorage.getItem("arbre-theme-4");if(t&&THEME_COULEURS[t])return t;var a=localStorage.getItem("arbre-theme");if(a&&a!=="papier"&&THEME_COULEURS[a])return a;return "ivoire";}catch(e){return "ivoire";}}
  function appliquerTheme(nom){
    if(!THEME_COULEURS[nom])nom="graphite";
    var r=document.documentElement;
    if(nom==="papier")r.removeAttribute("data-theme");else r.setAttribute("data-theme",nom);
    try{localStorage.setItem("arbre-theme-4",nom);}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute("content",THEME_COULEURS[nom]);
    /* Le bouton de la colonne montre le theme choisi. */
    var ob=document.getElementById("ouvrirteme");
    if(ob){
      var p=ob.querySelector(".pastille"),n=ob.querySelector(".nom");
      if(p)p.style.background=THEME_APERCU[nom];
      if(n)n.textContent=THEME_NOMS[nom];
    }
    document.querySelectorAll("[data-choix]").forEach(function(b){
      var on=b.getAttribute("data-choix")===nom;
      b.classList.toggle("on",on);

      var c=b.querySelector(".coche");
      if(c)c.textContent=on?"\u2713":"";
    });

  function boutonAide(){
    var b=document.createElement('button');
    b.type='button';b.id='bouton-aide';b.className='btn';
    b.innerHTML='<span aria-hidden="true">?</span> Comment ça marche';
    b.onclick=function(){ouvrirAide();};

  function ouvrirAide(){

    if(!a)return;
    a.classList.add('open');
    var f=a.querySelector('button');
    if(f)requestAnimationFrame(function(){try{f.focus();}catch(e){}});
  }
  function confortEtAide(){
    quand('confort','app',function(app){
      var shell=app.querySelector('.shell'),aside=shell&&shell.querySelector('aside');
      if(!shell||!aside)return false;
      if(document.getElementById('bloc-confort'))return;

      /* Choix de la taille d'affichage, avec son libelle en clair. */
      var bloc=document.createElement('div');
      bloc.id='bloc-confort';bloc.className='bloc-confort';
      bloc.innerHTML='<p class="section-label">Taille du texte</p>'
        +'<div class="choix-taille" role="group" aria-label="Taille du texte">'
        +'<button type="button" data-confort="1">Normale</button>'
        +'<button type="button" data-confort="1.3">Grande</button>'

        +'</div>';
      aside.appendChild(bloc);
      bloc.querySelectorAll('[data-confort]').forEach(function(b){
        b.onclick=function(){if(window.familyConfort)window.familyConfort(b.dataset.confort);if(window.familyRender)window.familyRender(false);};
      });
      if(window.familyConfort&&window.familyConfortValeur)window.familyConfort(window.familyConfortValeur());

      /* Le theme : un bouton qui montre le choix actuel, et un panneau. */
      var THEMES=[
        ["papier","Papier","Creme chaleureux, le reglage d'origine","#f6f5f0","#275447"],
        ["ivoire","Ivoire","Blanc doux, sans brillance","#faf7f0","#3f5148"],
        ["sepia","Sepia","Parchemin, lumiere chaude","#f2e9d6","#6a5330"],
        ["sauge","Sauge","Vert doux, reposant","#edf2ea","#2f5c45"],
        ["nuit","Nuit","Sombre chaud, pour le soir","#1b1d1a","#8fbfa6"],
        ["graphite","Graphite","Gris sombre, tres sobre","#1c1c1c","#a3c4b0"],
        ["ardoise","Ardoise","Bleu sombre, reposant","#171b22","#8fb3d9"],
        ["contraste","Contraste","Noir sur blanc, lisibilite maximale","#ffffff","#0b3b2c"]
      ];
      /* Le reglage des couleurs vit dans la barre du haut, a gauche de « Code Mermaid ». */
      var btnT=document.createElement("button");
      btnT.type="button";btnT.id="ouvrirteme";btnT.className="btn theme-btn";
      btnT.setAttribute("aria-haspopup","dialog");
      btnT.setAttribute("aria-label","Couleurs de l\u2019arbre");
      btnT.innerHTML='<span class="pastille" aria-hidden="true"></span><span class="nom">Graphite</span><span class="fleche" aria-hidden="true">\u25be</span>';
      var zoneT=document.querySelector(".topactions");
      if(zoneT)zoneT.insertBefore(btnT,zoneT.firstChild);else aside.appendChild(btnT);

      /* Le panneau, construit une seule fois puis rouvert au besoin. */
      var modT=document.createElement("div");
      modT.className="modal";modT.id="thememodal";
      modT.setAttribute("role","dialog");modT.setAttribute("aria-modal","true");modT.setAttribute("aria-labelledby","themetitre");
      modT.innerHTML='<div class="dialog"><div class="dialog-head"><b id="themetitre">Votre arbre, vos couleurs</b><button class="close" id="themeclose" aria-label="Fermer">&#215;</button></div><p class="theme-note">Choisissez ce qui repose le plus vos yeux. Le choix est garde pour votre prochaine visite.</p><div class="themes" role="listbox" aria-label="Themes de couleurs"></div></div>';
      document.body.appendChild(modT);
      var listeT=modT.querySelector(".themes");
      THEMES.forEach(function(p){
        var b=document.createElement("button");

        ["header.top","#layout","#panel"].forEach(function(s){var e=document.querySelector(s);if(e)e.setAttribute("inert","");});

      }
      function fermerPanneauTheme(){
        modT.classList.remove("open");
        ["header.top","#layout","#panel"].forEach(function(s){var e=document.querySelector(s);if(e)e.removeAttribute("inert");});
        if(dernierFocus&&dernierFocus.focus)try{dernierFocus.focus();}catch(e){}
      }
      document.getElementById("ouvrirteme").onclick=ouvrirPanneauTheme;
      document.getElementById("themeclose").onclick=fermerPanneauTheme;
      modT.onclick=function(e){if(e.target===modT)fermerPanneauTheme();};
      document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modT.classList.contains("open"))fermerPanneauTheme();});
      appliquerTheme(themeEnregistre());

      /* La note sur les sources passe en bloc repliable : la colonne tient alors
         sans defiler, et la signature se pose en bas a gauche sans rien recouvrir. */
      (function(){
        var priv=document.querySelector('aside .privacy');
        if(!priv||priv.tagName==='DETAILS')return;
        var d=document.createElement('details');d.className='privacy';
        var s=document.createElement('summary');s.textContent='Les liens, avec leurs sources';
        var p=document.createElement('p');
        p.textContent=(priv.textContent||'').replace('Les liens, avec leurs sources','').trim();
        d.appendChild(s);d.appendChild(p);priv.parentNode.replaceChild(d,priv);
      })();

      /* Signature, en bas de la colonne de gauche. */
      var sign=document.createElement("div");
      sign.className="signature";
      sign.innerHTML='<b>Créé avec Berceau</b><span>Arbre de démonstration fictif</span>';
      aside.appendChild(sign);

      /* Aide accessible en permanence. */
      var nav=aside.querySelector('.nav');
      if(nav&&!document.getElementById('bouton-aide'))nav.appendChild(boutonAide());

      /* Bandeau de reperes, sous la barre d'outils. */
      var main=shell.querySelector('.main');
      if(main&&!document.getElementById('repere')){
        var r=document.createElement('p');
        r.id='repere';
        r.innerHTML='<b>Glissez</b> pour déplacer l\u2019arbre &middot; <b>molette</b> ou deux doigts pour zoomer &middot; <b>cliquez sur une personne</b> pour lire sa fiche';
        main.insertBefore(r,main.firstChild);
      }

      /* Panneau d'aide, en phrases courtes. */
      if(!document.getElementById('aide')){
        var aide=document.createElement('div');
        aide.id='aide';aide.className='modal';

        aide.setAttribute('aria-labelledby','aidetitre');
        aide.innerHTML='<div class="dialog"><div class="dialog-head"><b id="aidetitre">Comment utiliser l\u2019arbre</b><button class="close" aria-label="Fermer">\u00d7</button></div>'

          +'<li><span aria-hidden="true">1</span><div><b>Cliquez sur une personne</b> pour lire sa fiche : ses dates, ses lieux, ses parents, ses enfants.</div></li>'
          +'<li><span aria-hidden="true">2</span><div><b>Le + au-dessus d\u2019une personne</b> ouvre ses parents. <b>Le + en dessous</b> ouvre ses enfants et ses proches. Le m\u00eame bouton devient \u2212 pour refermer.</div></li>'
          +'<li><span aria-hidden="true">3</span><div><b>Faites glisser</b> l\u2019arbre avec le doigt ou la souris pour le déplacer. Utilisez la <b>molette</b> (ou deux doigts) pour zoomer.</div></li>'
          +'<li><span aria-hidden="true">4</span><div><b>Tout voir</b> remet l\u2019arbre entier dans l\u2019écran. <b>la personne de départ</b> vous ramene a la lignee directe.</div></li>'
          +'<li><span aria-hidden="true">5</span><div><b>Vous cherchez quelqu\u2019un ?</b> Tapez son nom dans la barre de recherche, en haut de la page.</div></li>'

          +'<div class="actions"><button class="btn primary" id="aideok">J\u2019ai compris</button></div></div>';
        var porte=app.querySelector('.shell');
        if(porte)porte.appendChild(aide);
        aide.querySelector('.close').onclick=function(){aide.classList.remove('open');};
        document.getElementById('aideok').onclick=function(){aide.classList.remove('open');};
        aide.addEventListener('click',function(e){if(e.target===aide)aide.classList.remove('open');});
        try{
          if(!localStorage.getItem('arbre-aide-vue')){
            localStorage.setItem('arbre-aide-vue','1');
            setTimeout(function(){ouvrirAide();},900);
          }
        }catch(e){}
      }
    });
  }

  var TACHES=[
    function(){['modal','directory','editmodal','aide'].forEach(suivreModale);},
    function(){GROUPES.forEach(function(g){groupe(g[0],g[1],g[2])();});},
    suivreEditeur,
    focusApresRendu,
    compteurs,
    lienEvitement,
    confortEtAide
  ];
  var prevu=false;
  function planifier(){if(prevu)return;prevu=true;requestAnimationFrame(function(){prevu=false;passer();});}

  passer();

<style id="v4-polish">
/* ===== v4 : courbes douces, cartes harmonisees, navigation fluide ===== */
:root{
  --spine:#2f6b52;
  --union:#c3a87c;
  --collat:#aebbb0;
  --card-line:#cbd8cd;
  --card-shadow:0 3px 6px #24372b14;
}
#viewport{will-change:transform}

/* --- liens : courbes --- */
.link{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s ease,stroke-width .25s ease,opacity .25s ease}
.link.link-branch{stroke:var(--collat);stroke-width:1.5;opacity:.92}
.link.link-union{stroke:var(--union);stroke-width:1.8;opacity:.96}
.link.link-spine{stroke:var(--spine);stroke-width:2.7;opacity:1}

/* --- cartes : meme famille graphique partout (rayon, filet, ombre douce) --- */
.person{cursor:pointer}
.person rect{
  fill:#fffdf8;
  stroke:var(--card-line);
  stroke-width:1.3;
  rx:15;ry:15;
  filter:drop-shadow(0 3px 6px #24372b14);
  transition:filter .18s ease,stroke-width .18s ease,stroke-opacity .18s ease;
}
.person:hover rect{stroke-width:2.5;filter:drop-shadow(0 8px 18px #24372b2b)}
.person.root:hover rect{stroke-width:2.9}
.person.selected rect{stroke:#b98b4e!important;stroke-width:2.8!important;filter:drop-shadow(0 8px 20px #b98b4e3d)}
.person.root rect{stroke-width:2.4}
.person text{user-select:none}

/* --- point d'union : badge arrondi, comme les cartes --- */
.union-badge rect{transition:stroke-width .18s ease}
.union-badge:hover rect{stroke-width:2.2}

/* --- boutons + / - : meme rayon que les cartes --- */
.branch-toggle rect{transition:fill .16s ease,stroke-width .16s ease}
.branch-toggle:hover rect,.branch-toggle:focus rect{stroke-width:3;fill:#eef6ec}

/* --- barre d'outils et boutons de navigation --- */
.toolbar .btn{transition:background .16s ease,border-color .16s ease,transform .12s ease}
.toolbar .btn:hover{background:#f2f6ef;border-color:#c3d3c6}
.toolbar .btn:active{transform:translateY(1px)}
#zoomout,#zoomin,#fit{transition:background .16s ease,transform .12s ease,box-shadow .16s ease}
#zoomout:hover,#zoomin:hover,#fit:hover{background:#f2f6ef;box-shadow:0 4px 16px #173c3538}
#zoomout:active,#zoomin:active,#fit:active{transform:scale(.95)}

/* --- toile de fond un peu plus lisible --- */
.canvas{background-color:#fcfbf7;background-image:radial-gradient(#d7ded4 .76px,transparent .76px);background-size:20px 20px}
@media(max-width:850px){.canvas{border-radius:14px}}

</style>
<style id="v5-polish">
/* ===== v5 : zoom semantique, mode focus, animations respectueuses ===== */

/* --- 1) Zoom semantique : le texte apparait selon le niveau de zoom --- */
#tree[data-zoom="mid"] .person text.tdates{display:none}
#tree[data-zoom="mid"] .person text.tname{font-size:16px}
#tree[data-zoom="far"] .person text.tdates{display:none}
#tree[data-zoom="far"] .branch-toggle{display:none}
#tree[data-zoom="far"] .person rect{stroke-width:1.7}
#tree[data-zoom="far"] .person rect{filter:drop-shadow(0 2px 4px #24372b1f)}

/* --- 2) Mode focus : le lien avec la personne de départ s'illumine, le reste s'estompe --- */
#tree.focus-mode .person,
#tree.focus-mode .link,
#tree.focus-mode .union-badge,
#tree.focus-mode .branch-toggle{
  transition:opacity .24s ease,stroke-width .24s ease;
}
#tree.focus-mode .person{opacity:.15}
#tree.focus-mode .person.on-path{opacity:1}

#pathback{border-color:#b5cfc0;background:#f0f7ef;color:#245646;font-weight:600}

/* --- 3) Animations respectueuses du reglage systeme --- */
@media (prefers-reduced-motion: reduce){
  .link,.person rect,.branch-toggle rect,.union-badge rect,.toolbar .btn,
  #zoomout,#zoomin,#fit,#pathback,.chip,.nav button{
    transition:none!important;

</style>
<style id="v6-polish">

}


/* ===== correctifs d'audit — a reporter dans la source privee de l'application ===== */

/* 1) Indicateur de focus des cartes. La couleur etait ecrite en attribut style
      sur <rect>, ce qui ecrasait .person:focus rect : aucune carte n'affichait
      de focus visible (WCAG 2.4.7). Les valeurs passent par des proprietes CSS. */
.person rect{fill:var(--fill,#fffdf8);stroke:var(--stroke,var(--card-line));stroke-width:var(--sw,1.3)}
.person:focus rect,.person:focus-visible rect{stroke:#173c35!important;stroke-width:3.2px!important}

/* 2) Anneau de focus du champ de recherche : outline:none sans remplacement. */

/* 1) ZOOM SEMANTIQUE A TROIS NIVEAUX.
      De pres : la carte complete. Au milieu : le nom court et les annees,
      agrandis. De loin : les initiales, contre-ecrasees pour rester
      lisibles. A chaque niveau, ce qui est affiche est dimensionne pour
      etre lu : plus aucun palier ou le texte disparait. */
.tinit,.tshort,.tyears{pointer-events:none}
.tshort{font-size:22px;font-weight:650;fill:#173c35}
.tyears{font-size:18px;font-weight:600;fill:#4d6058}

#tree[data-zoom="far"] .tinit{font-size:calc(14px*var(--ls,1))}

/* 2) NOUVELLE CARTE.
      Un filet vertical aux couleurs de la branche permet de reconnaitre
      chaque lignee d'un coup d'oeil, le sexe est indique par un glyphe et
      non plus par la seule couleur, et les cadres sont plus nets. */
.person rect{stroke-width:1.6}

#tree[data-zoom="mid"] .person rect,#tree[data-zoom="far"] .person rect{filter:drop-shadow(0 2px 5px #24372b14)}

/* 3) FLUIDITE : fondu enchaine entre deux vues, et indicateur pendant les
      calculs lourds pour que l'attente soit visible plutot que figee. */
.canvas{position:relative}
.main{position:relative}
.arbre-fondu{position:absolute;inset:0;pointer-events:none;opacity:1;transition:opacity .38s ease}
#calcul{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:9px;background:#fffdf8;border:1px solid #c9d6c9;border-radius:999px;padding:7px 16px;font:600 12.5px system-ui,sans-serif;color:#245646;box-shadow:0 6px 20px #24372b1f;pointer-events:none}
